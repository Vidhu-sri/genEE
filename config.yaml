data_dir: data
prompts_dir: prompts
results_dir: results

generator_provider: openai
generator_model: gpt-4o-mini

evaluator_backend: film
film_checkpoint: evaluator/checkpoints/best_dimensions_mpnet.pt
evaluator_device: cpu   # use cuda on GPU pod

iterations: 15
sim_K: 3
sim_S: 5000
sim_T: 1.5
sim_RS: 11
seed: 42

initial_ip_size: 5
num_generate: 1
num_drop: 1
users_per_persona: 10

qs_model: gpt-4-turbo
qs_temperature: 0.0
gen_temperature: 0.8
batch_size: 20
rate_limit_rps: 5
